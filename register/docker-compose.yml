services:
  db:
    image: mysql
    container_name: mysql
    restart: always

    environment:
      MYSQL_DATABASE: mysql
      MYSQL_USER: mysql
      MYSQL_PASSWORD: root
      MYSQL_ROOT_PASSWORD: root

    ports:
      - "3307:3306"

    volumes:
      - ./mysql-data:/var/lib/mysql

    networks:
      - mynetwork

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-umysql", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  web:
    build:
      context: .

    container_name: django_web

    restart: always

    ports:
      - "8000:8000"

    depends_on:
      db:
        condition: service_healthy

    networks:
      - mynetwork
    command: sh -c "
      python manage.py migrate &&
      python manage.py runserver 0.0.0.0:8000
      "
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: mysql
      DB_USER: mysql
      DB_PASSWORD: root

    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/admin/')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s


networks:
  mynetwork:
    driver: bridge
